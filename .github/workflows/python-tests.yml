name: Quantum Unit Tests

on:
  push:
    branches: [main, "feature/*", "sdvrp_*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy qiskit
      - name: Run exhaustive small-instance and GAS oracle tests
        run: python -m unittest discover -s tests -v
