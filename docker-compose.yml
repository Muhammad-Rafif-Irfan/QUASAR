# =============================================================================
# QUASAR — Docker Compose (API + Frontend)
#
# Usage:
#   Full stack:   docker compose up --build
#   API only:     docker compose up --build quasar-api
#
# Local (no Docker):
#   Windows:  .\scripts\dev.ps1
#   Unix:     bash scripts/dev.sh
#
# Author: Trịnh Hoàng Tú (System Architecture & DevSecOps)
# =============================================================================

services:
  quasar-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quasar-api
    ports:
      - "8000:8000"
    environment:
      - QUASAR_ENV=${QUASAR_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/quasar.db}
      - IBM_QUANTUM_TOKEN=${IBM_QUANTUM_TOKEN:-}
      - QISKIT_IBM_TOKEN=${QISKIT_IBM_TOKEN:-}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-20}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - OPTIMIZE_BURST_LIMIT=${OPTIMIZE_BURST_LIMIT:-5}
      - OPTIMIZE_BURST_WINDOW=${OPTIMIZE_BURST_WINDOW:-60}
      - MAX_REQUEST_BODY_KB=${MAX_REQUEST_BODY_KB:-512}
      - MAX_OPTIMIZATION_STOPS=${MAX_OPTIMIZATION_STOPS:-15}
      - MAX_QAOA_STOPS=${MAX_QAOA_STOPS:-3}
      - QAOA_SIMULATOR_MAXITER=${QAOA_SIMULATOR_MAXITER:-8}
      - QAOA_HARDWARE_MAXITER=${QAOA_HARDWARE_MAXITER:-4}
      - OSMNX_DEADLINE_SECONDS=${OSMNX_DEADLINE_SECONDS:-8}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
    volumes:
      - quasar-data:/app/data
      - quasar-maps:/app/static/maps
      - quasar-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  quasar-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quasar-frontend
    ports:
      - "8080:80"
    depends_on:
      quasar-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  quasar-data:
  quasar-maps:
  quasar-cache:
